<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El futuro de la información deportiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 80px 24px;
      overflow-x: hidden;
    }

    .etiqueta-superior {
      font-size: 11px;
      letter-spacing: 4px;
      color: #991b1b;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 24px;
      opacity: 0;
      animation: aparecerArriba 0.8s ease forwards 0.2s;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 400;
      line-height: 1.05;
      text-align: center;
      max-width: 900px;
      letter-spacing: -1px;
      margin-bottom: 24px;
      opacity: 0;
      animation: aparecerArriba 0.8s ease forwards 0.4s;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
    }

    p.subtitulo {
      color: #666666;
      font-size: clamp(14px, 2vw, 17px);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      max-width: 540px;
      line-height: 1.6;
      margin-bottom: 48px;
      opacity: 0;
      animation: aparecerArriba 0.8s ease forwards 0.6s;
    }

    .contenedor-video {
      position: relative;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 9 / 19.5;
      background: #080808;
      border: 1px solid #1f1f1f;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 0 50px rgba(153, 27, 27, 0.15), 0 20px 40px rgba(0, 0, 0, 0.9);
      margin-bottom: 40px;
      opacity: 0;
      animation: zoomSuave 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
    }

    .marco-pantalla {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      background-color: #000000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caja-estado {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #1a1a1a;
      padding: 12px 24px;
      border-radius: 100px;
      background-color: #050505;
      opacity: 0;
      animation: aparecerArriba 0.8s ease forwards 1s;
    }

    .indicador-pulso {
      width: 8px;
      height: 8px;
      background-color: #991b1b;
      border-radius: 50%;
      box-shadow: 0 0 8px #991b1b;
      animation: parpadeo 2s infinite ease-in-out;
    }

    .texto-estado {
      color: #888888;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .pie {
      margin-top: 50px;
      color: #333333;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes aparecerArriba {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zoomSuave {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes parpadeo {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>

  <div class="etiqueta-superior">Fútbol Editorial — Edición 01</div>

  <h1>El futuro de las plataformas de <em>información deportiva</em>.</h1>

  <p class="subtitulo">Sin saturación publicitaria. Datos oficiales, tipografía cuidada y marcadores en riguroso directo.</p>

  <div class="contenedor-video">
    <div class="marco-pantalla">
      <video autoplay loop muted playsinline>
        <source src="demo-app.mp4" type="video/mp4">
        Tu navegador no soporta vídeo HTML5.
      </video>
    </div>
  </div>

  <div class="caja-estado">
    <div class="indicador-pulso"></div>
    <span class="texto-estado">Proyecto actualmente en desarrollo</span>
  </div>

  <div class="pie">Iván Rubio — 2026</div>

</body>
</html>
